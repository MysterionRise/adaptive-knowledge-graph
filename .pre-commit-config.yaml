repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Raw source text and pipeline output (data/raw, data/processed) and the
      # eval reports written by scripts/evaluate_rag.py are generated; rewriting
      # them would be undone on regeneration. Hand-written files stay checked.
      - id: trailing-whitespace
        exclude: ^(data/(raw|processed)/|docs/evals/latest\.(json|md)$)
      - id: end-of-file-fixer
        exclude: ^(data/(raw|processed)/|docs/evals/latest\.(json|md)$)
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  # Ruff and mypy run from the project's Poetry environment, so the hooks use
  # exactly the versions locked in poetry.lock and check what CI checks.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix --exit-non-zero-on-fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        # Paths come from [tool.mypy] files in pyproject.toml.
        entry: poetry run mypy
        language: system
        types: [python]
        files: ^(backend/app|scripts)/
        pass_filenames: false

  # Frontend hooks
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend ESLint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
