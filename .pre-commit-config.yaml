repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # data/ (pipeline output, raw source text) and docs/evals/ (written by
      # scripts/evaluate_rag.py) are generated; rewriting them would be undone on regeneration.
      - id: trailing-whitespace
        exclude: ^(data|docs/evals)/
      - id: end-of-file-fixer
        exclude: ^(data|docs/evals)/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
        exclude: ^data/
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  # Keep rev in sync with the ruff version locked in poetry.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        # Python only, like CI; the upstream hook also formats code blocks in Markdown.
        types_or: [python, pyi, jupyter]

  # Runs exactly what CI runs, using the project's Poetry environment and type stubs.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy backend/app scripts/
        language: system
        types: [python]
        pass_filenames: false

  # Frontend hooks
  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend ESLint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
