version: 2
description: "Golden set for portfolio-grade KG-RAG smoke and regression evaluation."
cases:
  - id: us_history_revolution_causes
    subject: us_history
    question: "What caused the American Revolution?"
    expected_terms: ["taxation", "representation", "British", "colonies"]
    expected_sources: ["Imperial Reforms and Colonial Protests", "War for Independence"]
    tags: ["answerable", "kg_expansion"]

  - id: us_history_boston_tea_party
    subject: us_history
    question: "Why did colonists protest with the Boston Tea Party?"
    expected_terms: ["tea", "protest", "tax", "British"]
    expected_sources: ["Boston Tea Party", "Imperial Reforms and Colonial Protests"]
    tags: ["answerable", "source_grounding"]

  - id: us_history_articles_constitution
    subject: us_history
    question: "How did the Constitution address weaknesses of the Articles of Confederation?"
    expected_terms: ["Constitution", "Articles of Confederation", "federal", "government"]
    expected_sources: ["Creating Republican Governments", "Constitution"]
    tags: ["answerable", "cross_chapter"]

  - id: us_history_federalists_antifederalists
