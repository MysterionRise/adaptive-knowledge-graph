version: 2
description: "Golden set for portfolio-grade KG-RAG smoke and regression evaluation."
cases:
  - id: us_history_revolution_causes
    subject: us_history
    question: "What caused the American Revolution?"
    expected_terms: ["taxation", "representation", "British", "colonies"]
    expected_sources:
      - "Confronting the National Debt: The Aftermath of the French and Indian War"
      - "The Stamp Act and the Sons and Daughters of Liberty"
      - "Disaffection: The First Continental Congress and American Identity"
    tags: ["answerable", "kg_expansion"]

  - id: us_history_boston_tea_party
