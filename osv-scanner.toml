# osv-scanner configuration (https://google.github.io/osv-scanner/configuration/)
#
# Time-boxed exceptions for advisories that cannot be fixed in this release. Each entry
# names the upgrade issue that removes it:
#   - transformers entries are fixed only in a new major version (#71);
#   - the two torch entries are fixed within 2.x (2.11 / 2.13), but those releases switch
#     the Linux wheels to CUDA 13, a deliberate wheel-set change deferred to #79.
# Delete an entry when its upgrade lands; do not extend ignoreUntil without re-checking
# the advisory against the code.

