[tool.poetry]
name = "adaptive-knowledge-graph"
version = "0.1.0"
description = "Local-first adaptive learning with knowledge graphs, hybrid retrieval and local LLMs"
authors = ["Konstantin Perikov"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/MysterionRise/adaptive-knowledge-graph"
repository = "https://github.com/MysterionRise/adaptive-knowledge-graph"
documentation = "https://github.com/MysterionRise/adaptive-knowledge-graph#readme"
keywords = [
    "knowledge-graph",
    "adaptive-learning",
    "rag",
    "neo4j",
    "opensearch",
    "local-llm",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
packages = [{include = "backend"}]

[tool.poetry.urls]
"Issues" = "https://github.com/MysterionRise/adaptive-knowledge-graph/issues"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Web framework
fastapi = ">=0.142.1,<1.0"
starlette = ">=1.3.1"  # security floor; fastapi itself only requires >=0.46
uvicorn = {extras = ["standard"], version = ">=0.54,<1.0"}
slowapi = "^0.1.10"

# NLP & Embeddings
transformers = ">=4.57.6,<5"  # 5.x together with sentence-transformers 6: #71
sentence-transformers = "^2.7.0"
torch = ">=2.10.0,<2.11"  # 2.11+ switches the Linux wheels to CUDA 13; upgrade deliberately (#79)
yake = "^0.4.8"
spacy = "^3.7.2"

# Knowledge Graph
neo4j = "^5.28.0"
networkx = "^3.6"

# Vector DB & Search
opensearch-py = "^3.0.0"

# LLM Integration
openai = "^2.0.0"  # required by langchain_community ChatOpenAI (LLM_MODE=remote, OpenRouter)

# LangChain (GraphCypherQAChain); 1.x migration: #72
langchain = ">=0.3.30,<0.4"
langchain-core = ">=0.3.86,<1.0"
langchain-community = ">=0.3.31,<0.4"
langchain-neo4j = ">=0.2,<0.3"
langsmith = ">=0.8.18,<1.0"  # security floor for the langchain-core dependency

# Numerics
numpy = "^2.1"  # langchain-community requires >=2.1 on Python 3.13

# Data Processing
beautifulsoup4 = "^4.12.3"
lxml = "^6.1"
pydantic = "^2.6.0"
pydantic-settings = "^2.14.2"

# Utilities
httpx = "^0.28.0"
aiohttp = "^3.14.3"
certifi = ">=2026.0.0"
python-dotenv = "^1.2.2"
loguru = "^0.7.2"
tenacity = "^8.2.3"
requests = "^2.33.0"
pyyaml = "^6.0.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^9.0.3"
pytest-asyncio = "^1.0.0"
pytest-cov = "^7.0.0"
pytest-mock = "^3.12.0"

# Code quality
ruff = "^0.16"
mypy = "^1.8.0"
pre-commit = "^4.0.0"

# Type stubs
types-beautifulsoup4 = "^4.12.0"
types-requests = "^2.31.0"
types-toml = "^0.10.8"

# Testing utilities
toml = "^0.10.2"

[tool.poetry.group.pyirt]
optional = true

[tool.poetry.group.pyirt.dependencies]
# IRT modeling - optional due to potential conflicts
# Requires Python 3.11 specifically (incompatible with 3.12+)
py-irt = {git = "https://github.com/nd-ball/py-irt.git", python = ">=3.11,<3.12"}

[tool.poetry.group.pybkt]
optional = true

[tool.poetry.group.pybkt.dependencies]
# BKT modeling - optional
# Requires Python 3.11 specifically (incompatible with 3.12+)
pyBKT = {git = "https://github.com/CAHLR/pyBKT.git", python = ">=3.11,<3.12"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    # TODO(#67 follow-up): migrate `(str, Enum)` classes to `enum.StrEnum`. Not auto-fixed:
    # StrEnum changes str()/format() output ("NodeType.CONCEPT" -> "concept").
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py

[tool.mypy]
python_version = "3.11"
mypy_path = "."
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "yaml.*",
    "yake.*",
    "opensearchpy.*",
    "neo4j.*",
    "networkx.*",
    "sentence_transformers.*",
    "langchain.*",
    "langchain_community.*",
    "langchain_neo4j.*",
    "slowapi.*",
    "spacy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=backend/app --cov-report=term-missing"
xfail_strict = true
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "tribunal: marks tests as tribunal adversarial review tests",
]

[tool.coverage.run]
source = ["backend/app"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
