# Markdown linting configuration (markdownlint / markdownlint-cli2).
# Every rule is on by default; each exception below says why it is off.
default: true

# MD012 (multiple blank lines): scripts/evaluate_rag.py writes
# docs/evals/latest.md with a trailing blank line.
MD012: false

# MD013 (line length): tables, commands and URLs are easier to review unwrapped.
MD013: false

# MD024 (duplicate headings): allowed when the headings are not siblings,
# for example a repeated "Commands" section under different parents.
MD024:
  siblings_only: true

# MD033 (inline HTML): allowed for badges, images and <details> blocks.
MD033: false

# MD038 (spaces inside code spans): the generated evaluation report writes
# empty and padded code spans.
MD038: false

# MD041 (first line must be a top-level heading): the pull request template
# and similar fragments start with a second-level heading.
MD041: false

# MD046 (code block style): always use fenced code blocks.
MD046:
  style: fenced

# MD060 (table column style): tables are not column-aligned.
MD060: false

# The archived review in docs/archive/tribunal-2026-02/ has its own
# .markdownlint.yaml that relaxes spacing rules for the transcripts.
