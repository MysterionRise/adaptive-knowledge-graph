# Markdown linting configuration
default: true

# The repository has long-form architecture, demo, and evaluation docs where
# wrapping every command, table, and URL creates churn without improving review.
# Keep markdownlint focused on structural issues instead of legacy style noise.

# MD012: Multiple consecutive blank lines
MD012: false

# MD013: Line length
MD013: false

# MD022: Headings should be surrounded by blank lines
MD022: false

# MD026: Trailing punctuation in heading
MD026: false

# MD031: Fenced code blocks should be surrounded by blank lines
MD031: false

# MD032: Lists should be surrounded by blank lines
MD032: false

# MD033: Allow inline HTML (for badges, etc.)
MD033: false

# MD034: Bare URLs
MD034: false

# MD036: Emphasis used instead of a heading
MD036: false

# MD038: Spaces inside code span elements
MD038: false

# MD041: First line in file should be a top-level heading
MD041: false

# MD040: Fenced code blocks should have a language specified
MD040: false

# MD046: Code block style
MD046:
  style: fenced

# MD058: Tables should be surrounded by blank lines
MD058: false

# MD060: Table column style
MD060: false

# MD024: Multiple headings with the same content
MD024:
  siblings_only: true
