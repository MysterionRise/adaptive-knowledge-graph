# osv-scanner configuration for frontend/package-lock.json
# (https://google.github.io/osv-scanner/configuration/).
#
# osv-scanner applies the osv-scanner.toml next to each lockfile, so the root
# file does not cover this one. Same rules as the root file: each entry is
# time-boxed (ignoreUntil at most 90 days out), gives a reason and names the
# issue that removes it. Do not extend ignoreUntil without re-checking the
# advisory.

