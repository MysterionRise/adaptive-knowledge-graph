# Local stack for Adaptive Knowledge Graph.
#
#   make up                         Neo4j + OpenSearch, waits until both are healthy
#   make docker-up PROFILE=cpu      + containerised API (cpu | gpu | full)
#
# Without make (run from the repository root):
#   docker compose -f infra/compose/compose.yaml up -d --wait                  # databases only
#   docker compose -f infra/compose/compose.yaml --profile cpu up -d --wait    # + API on CPU
#   docker compose -f infra/compose/compose.yaml --profile gpu up -d --wait    # + API on CUDA
#   docker compose -f infra/compose/compose.yaml --profile full up -d --wait   # + API (CPU) + frontend
#   add --profile ollama to run Ollama in a container too, and set
#   CONTAINER_OLLAMA_HOST=http://ollama:11434 so the API uses it.
#
# Every published port binds to 127.0.0.1. Host ports and credentials come from the shell or,
# through the Makefile (`--env-file .env`), from the repository-root .env:
#   NEO4J_HTTP_PORT (7474), NEO4J_BOLT_PORT (7687), OPENSEARCH_PORT (9200), API_PORT (8000),
#   FRONTEND_PORT (3000), OLLAMA_PORT (11434), NEO4J_PASSWORD, OPENSEARCH_PASSWORD.
# NEO4J_PASSWORD is applied only when the Neo4j volume is first created.
#
# The API containers reach an Ollama on the host as host.docker.internal. Docker Desktop,
# Rancher Desktop, Colima and OrbStack resolve that name themselves; Linux Docker Engine needs
# compose.linux.yaml (maps it to the host gateway), which make and scripts/*.sh add on Linux.
#
# Requires Docker Compose >= 2.24 (optional env_file entries).
name: adaptive-kg

x-api-environment: &api-environment
  # Container-network endpoints; they override the host-oriented values in .env.
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
  OPENSEARCH_HOST: opensearch
  OPENSEARCH_PORT: "9200"
  OPENSEARCH_USER: admin
  OPENSEARCH_PASSWORD: ${OPENSEARCH_PASSWORD:-Opensearch-adaptive-graph123!}
  OPENSEARCH_USE_SSL: "false"
  OPENSEARCH_VERIFY_CERTS: "false"
  # Ollama on the host by default; http://ollama:11434 with --profile ollama.
  LLM_OLLAMA_HOST: ${CONTAINER_OLLAMA_HOST:-http://host.docker.internal:11434}

x-api-service: &api-service
  env_file:
    # Everything else (API_KEY, LLM_*, RATE_LIMIT_*, ...) comes from the repository-root .env.
    - path: ../../.env
      required: false
  volumes:
    - ../../data:/app/data
    - ../../docs/evals:/app/docs/evals:ro
    - hf_cache:/home/app/.cache/huggingface
  depends_on:
    neo4j:
      condition: service_healthy
    opensearch:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
    interval: 15s
    timeout: 10s
    retries: 5
    start_period: 60s

services:
  # Neo4j graph database
  neo4j:
    image: neo4j:5.26-community
    container_name: ${COMPOSE_PROJECT_NAME:-adaptive-kg}-neo4j
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"  # HTTP / Browser
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"  # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      # APOC core ships with the image; only the schema-introspection procedures that
      # langchain's Neo4jGraph needs (/api/v1/graph/schema, /api/v1/graph/query) are loaded, so
      # apoc.load.*, apoc.cypher.*, apoc.periodic.* and the rest are not callable. This is the
      # database-level backstop for LLM-generated Cypher; built-in db.* procedures are unaffected.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_allowlist: apoc.meta.*
      # apoc.meta.data needs unrestricted access; without this the image's APOC defaults would
      # mark every apoc.* procedure unrestricted
      NEO4J_dbms_security_procedures_unrestricted: apoc.meta.*
      NEO4J_apoc_import_file_enabled: "false"
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_server_default__listen__address: 0.0.0.0
      NEO4J_server_bolt_advertised__address: localhost:${NEO4J_BOLT_PORT:-7687}
      NEO4J_server_http_advertised__address: localhost:${NEO4J_HTTP_PORT:-7474}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  # OpenSearch vector + BM25 search
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    container_name: ${COMPOSE_PROJECT_NAME:-adaptive-kg}-opensearch
    environment:
      cluster.name: opensearch-cluster
      node.name: opensearch
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      # Local development only: no TLS or auth, which is why the port binds to 127.0.0.1.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:-Opensearch-adaptive-graph123!}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"  # REST API
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  # FastAPI backend on CPU
  api-cpu:
    <<: *api-service
    build:
      context: ../..
      dockerfile: infra/docker/api.cpu.Dockerfile
      args:
        # Match your host uid/gid on Linux so the container can write the bind-mounted data/
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: ${COMPOSE_PROJECT_NAME:-adaptive-kg}-api-cpu
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      <<: *api-environment
      EMBEDDING_DEVICE: cpu
      RERANKER_DEVICE: cpu
    profiles:
      - cpu
      - full

  # FastAPI backend on an NVIDIA GPU (needs the NVIDIA Container Toolkit)
  api-gpu:
    <<: *api-service
    build:
      context: ../..
      dockerfile: infra/docker/api.gpu.Dockerfile
      args:
        # Match your host uid/gid on Linux so the container can write the bind-mounted data/
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: ${COMPOSE_PROJECT_NAME:-adaptive-kg}-api-gpu
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      <<: *api-environment
      EMBEDDING_DEVICE: cuda
      RERANKER_DEVICE: cuda
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu

  # Next.js frontend, served by `next start` (the browser calls the API on localhost)
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    container_name: ${COMPOSE_PROJECT_NAME:-adaptive-kg}-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api-cpu:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    profiles:
      - full

  # Optional Ollama in a container (CPU inference; a host install is faster on macOS).
  # Pull the model once: docker compose -f infra/compose/compose.yaml exec ollama ollama pull <model>
  ollama:
    image: ollama/ollama:0.35.0
    container_name: ${COMPOSE_PROJECT_NAME:-adaptive-kg}-ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    profiles:
      - ollama

volumes:
  neo4j_data:
  neo4j_logs:
  opensearch_data:
  hf_cache:
  ollama_models:
