name: Set up Python and Poetry
description: >-
  Install Python and a pinned Poetry (via pipx), then build the in-project
  .venv with `poetry sync`. The .venv is restored from the Actions cache. On a
  miss outside pull requests it is saved straight after the install, before
  any job step can change it; pull requests only restore, to stay within the
  repository cache quota. The cache key covers the OS, runner image, full
  Python version, Poetry version, install arguments and poetry.lock.

inputs:
  python-version:
    description: Python version for actions/setup-python, for example "3.11".
    required: true
  install-args:
    description: >-
      Extra arguments for `poetry sync`, for example "--only dev". They are
      part of the cache key.
    required: false
    default: ""
  poetry-version:
    description: Poetry version installed with pipx.
    required: false
    default: "2.5.1"
  cache:
    description: >-
      "true" restores the .venv cache (and saves it on a miss, except on
      pull_request events); "false" always installs from scratch (for
      environments that would overflow the repository cache quota).
    required: false
    default: "true"
  check-lock:
    description: >-
      "true" runs `poetry check --lock` before the install, so a stale
      poetry.lock fails with a clear message instead of an install error.
    required: false
    default: "false"
  assert-cpu-torch:
    description: >-
      "true" fails the job when the installed torch is a CUDA build or any
      nvidia-* wheel is present: on Linux x86_64 the lock takes torch from
      the PyTorch CPU index (pyproject.toml), so CI never downloads the
      CUDA wheel set.
    required: false
    default: "false"

outputs:
  python-version:
    description: Full version of the installed Python.
    value: ${{ steps.python.outputs.python-version }}
  cache-hit:
    description: '"true" when the .venv was restored from an exact cache key match.'
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      id: python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry ${{ inputs.poetry-version }} with pipx
      shell: bash
      env:
        POETRY_VERSION: ${{ inputs.poetry-version }}
        PYTHON_PATH: ${{ steps.python.outputs.python-path }}
      run: |
        pipx install --python "${PYTHON_PATH}" "poetry==${POETRY_VERSION}"
        poetry --version
        poetry config virtualenvs.in-project true

    - name: Check poetry.lock is up to date with pyproject.toml
      if: inputs.check-lock == 'true'
      shell: bash
      run: poetry check --lock

    - name: Compute .venv cache key
      id: key
      if: inputs.cache == 'true'
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
        LOCK_HASH: ${{ hashFiles('poetry.lock') }}
        POETRY_VERSION: ${{ inputs.poetry-version }}
        PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
      run: |
        if [ -z "${LOCK_HASH}" ]; then
          echo "::error::poetry.lock not found; cannot build the .venv cache key"
          exit 1
        fi
        # Cache keys cannot contain commas, so the install arguments are hashed.
        args_hash=$(printf '%s' "${INSTALL_ARGS}" | sha256sum | cut -c1-12)
        prefix="venv-v1-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS:-unknown}-py${PYTHON_VERSION}-poetry${POETRY_VERSION}-${args_hash}-"
        echo "prefix=${prefix}" >> "${GITHUB_OUTPUT}"
        echo "key=${prefix}${LOCK_HASH}" >> "${GITHUB_OUTPUT}"

    - name: Restore .venv cache
      id: restore
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v6
      with:
        path: .venv
        key: ${{ steps.key.outputs.key }}
        # A venv built from an older poetry.lock is a warm start: `poetry sync`
        # below adds, upgrades and removes packages until it matches the lock.
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Report .venv cache result
      shell: bash
      env:
        CACHE_ENABLED: ${{ inputs.cache }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        PRIMARY_KEY: ${{ steps.key.outputs.key }}
        PYTHON_VERSION: ${{ steps.python.outputs.python-version }}
      run: |
        if [ "${CACHE_ENABLED}" != "true" ]; then
          result="disabled"
        elif [ "${CACHE_HIT}" = "true" ]; then
          result="hit (${PRIMARY_KEY})"
        elif [ -n "${MATCHED_KEY}" ]; then
          result="partial (restored ${MATCHED_KEY})"
        else
          result="miss (${PRIMARY_KEY})"
        fi
        echo "Python ${PYTHON_VERSION} .venv cache: ${result}" | tee -a "${GITHUB_STEP_SUMMARY}"

    - name: Install dependencies (poetry sync ${{ inputs.install-args }})
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
        PYTHON_PATH: ${{ steps.python.outputs.python-path }}
      run: |
        poetry env use "${PYTHON_PATH}"
        # INSTALL_ARGS is a list of CLI flags, so word splitting is intended.
        # shellcheck disable=SC2086
        poetry sync --no-interaction ${INSTALL_ARGS}

    - name: Assert CPU-only torch and no nvidia-* wheels
      if: inputs.assert-cpu-torch == 'true'
      shell: bash
      run: |
        poetry run python - <<'EOF'
        import importlib.metadata as metadata
        import sys

        import torch

        nvidia = sorted(
            d.metadata["Name"]
            for d in metadata.distributions()
            if d.metadata["Name"].lower().startswith("nvidia-")
        )
        print(f"torch {torch.__version__}, CUDA build: {torch.version.cuda}")
        if torch.version.cuda or nvidia:
            print(f"::error::CUDA torch or nvidia-* wheels in the CI environment: {nvidia}")
            sys.exit(1)
        EOF

    # Pull requests never save: each lock-changing PR would otherwise add
    # a full venv per Python version and push the repository over its cache quota.
    # They still warm-start from the main-branch cache via restore-keys.
    - name: Save .venv cache
      if: >-
        inputs.cache == 'true' &&
        steps.restore.outputs.cache-hit != 'true' &&
        github.event_name != 'pull_request'
      uses: actions/cache/save@v6
      with:
        path: .venv
        key: ${{ steps.key.outputs.key }}
