name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # Required gates: every job in this section is listed in `All Checks Passed`.
  # None of them has an `if:` condition or a paths filter, so none is skipped.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python and Poetry (dev group only)
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-args: --only dev

      - name: Check poetry.lock is up to date with pyproject.toml
        run: poetry check --lock

      - name: Run ruff linting
        run: poetry run ruff check backend/ scripts/

      - name: Run ruff format check
        run: poetry run ruff format --check backend/ scripts/

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-args: --without pyirt,pybkt
          free-disk-space: "true"

      - name: Run mypy
        run: poetry run mypy backend/app scripts/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        # A full venv with the CUDA torch wheels is ~3.7 GB compressed and the
        # repository cache quota is 10 GB, so only two full venvs are cached:
        # 3.11 (shared with type-check and tribunal) and 3.13 (slow source
        # builds). 3.12 installs from wheels in about two minutes.
        # Revisit once CPU-only torch wheels land (#79).
        include:
          - python-version: "3.11"
            cache: "true"
          - python-version: "3.12"
            cache: "false"
          - python-version: "3.13"
            cache: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ matrix.python-version }}
          install-args: --without pyirt,pybkt
          cache: ${{ matrix.cache }}
          free-disk-space: "true"

      - name: Run fast tests with coverage
        run: PYTEST_TEST_TIMEOUT_SECONDS=60 poetry run pytest -m "not tribunal" --cov=backend/app --cov-report=term

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-frontend

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests with coverage (Jest)
        run: npm run test:coverage -- --ci

      - name: Production build
        run: npm run build

      - name: Audit dependencies (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm audit --audit-level=high

  docker-compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate compose file
        run: docker compose -f infra/compose/compose.yaml config --quiet

      - name: Start databases and wait until they are healthy
        run: docker compose -f infra/compose/compose.yaml up -d --wait --wait-timeout 240 neo4j opensearch

      - name: Assert OpenSearch and Neo4j respond
        run: |
          health=$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s")
          echo "OpenSearch cluster health: ${health}"
          status=$(jq -r '.status' <<<"${health}")
          if [ "${status}" != "green" ] && [ "${status}" != "yellow" ]; then
            echo "::error::OpenSearch cluster status is '${status}'"
            exit 1
          fi
          discovery=$(curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            --header "Accept: application/json" http://localhost:7474/)
          echo "Neo4j HTTP discovery: ${discovery}"
          jq -e '.neo4j_version' <<<"${discovery}" > /dev/null

      - name: Show container status and logs
        if: failure()
        run: |
          docker compose -f infra/compose/compose.yaml ps --all
          docker compose -f infra/compose/compose.yaml logs --no-color --timestamps --tail 300

      - name: Tear down and remove volumes
        if: always()
        run: docker compose -f infra/compose/compose.yaml down --volumes --remove-orphans

  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            *.md
            docs/**/*.md
            frontend/*.md
            infra/**/*.md
            .github/*.md

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the bandit SARIF to code scanning
    env:
      BANDIT_VERSION: "1.9.4"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit (outside the project environment)
        run: python -m pip install --disable-pip-version-check "bandit[sarif]==${BANDIT_VERSION}"

      - name: Run bandit (gate, human-readable report)
        run: bandit -r backend/app

      - name: Run bandit (SARIF for code scanning)
        if: ${{ !cancelled() }}
        run: bandit -r backend/app --format sarif --output bandit.sarif --exit-zero

      - name: Upload bandit results to code scanning
        if: ${{ !cancelled() && hashFiles('bandit.sarif') != '' }}
        # Best effort: pull requests from forks get a read-only token.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit.sarif
          category: bandit

  # ---------------------------------------------------------------------------
  # Advisory gates: not in `All Checks Passed` yet. Release PR #104 promotes
  # them by adding them to its `needs` and dropping `continue-on-error`.
  # ---------------------------------------------------------------------------
  tribunal:
    name: Tribunal Tests (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          install-args: --without pyirt,pybkt
          free-disk-space: "true"

      - name: Run tribunal suite (adversarial risk register)
        # --no-cov: coverage is measured on the main suite; this partial run
        # must not trip a coverage threshold.
        run: PYTEST_TEST_TIMEOUT_SECONDS=60 poetry run pytest -m tribunal -rxX --no-cov

  dependency-audit:
    name: Dependency Audit (osv-scanner, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      security-events: write # upload the osv-scanner SARIF to code scanning
    env:
      OSV_SCANNER_VERSION: "2.6.0"
      # SHA-256 of osv-scanner_linux_amd64 from the release's osv-scanner_SHA256SUMS.
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install osv-scanner ${{ env.OSV_SCANNER_VERSION }} (checksum-verified)
        run: |
          install_dir="${RUNNER_TEMP}/osv-scanner"
          mkdir -p "${install_dir}"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${install_dir}/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${install_dir}/osv-scanner" | sha256sum --check --strict
          chmod +x "${install_dir}/osv-scanner"
          echo "${install_dir}" >> "${GITHUB_PATH}"

      # osv-scanner applies the osv-scanner.toml found next to each scanned
      # lockfile (the repository root for poetry.lock, frontend/ for
      # package-lock.json), so allowlists are honoured without a --config flag.
      - name: Scan lockfiles (SARIF for code scanning)
        # Exit code 1 means "vulnerabilities found"; the report step is the gate.
        run: |
          osv-scanner scan source --lockfile poetry.lock --lockfile frontend/package-lock.json \
            --format sarif --output-file osv.sarif || [ "$?" -eq 1 ]

      - name: Upload osv-scanner results to code scanning
        if: ${{ !cancelled() && hashFiles('osv.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: osv.sarif
          category: osv-scanner

      - name: Report vulnerabilities (fails when any are found)
        if: ${{ !cancelled() }}
        run: |
          set +e
          osv-scanner scan source --lockfile poetry.lock --lockfile frontend/package-lock.json \
            --format markdown --output-file osv-report.md
          rc=$?
          set -e
          if [ -s osv-report.md ]; then
            cat osv-report.md
            {
              echo "## osv-scanner (advisory)"
              echo
              cat osv-report.md
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit "${rc}"

  link-check:
    name: Link Check (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check relative links in Markdown (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Same file set as the markdownlint step; --offline skips remote URLs.
          args: >-
            --offline --no-progress --root-dir ${{ github.workspace }}
            './*.md' './docs/**/*.md' './frontend/*.md' './infra/**/*.md' './.github/*.md'
          fail: true
          token: "" # not needed offline; keep the GITHUB_TOKEN away from the tool

  # ---------------------------------------------------------------------------
  # Manual only: needs a running demo environment (WS-D is making the specs
  # hermetic; the release PR may promote it). Drop the `if:` before adding it
  # to `All Checks Passed`, or the gate would see it as skipped.
  # ---------------------------------------------------------------------------
  e2e-tests:
    name: E2E Tests (Playwright, manual demo env)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [frontend]
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js and install dependencies
        uses: ./.github/actions/setup-frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The required status check on `main`. Keep the name unchanged.
  # ---------------------------------------------------------------------------
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - lint
      - type-check
      - test
      - frontend
      - docker-compose-validate
      - docs-check
      - security
    if: always()
    steps:
      - name: Show required job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"${NEEDS_JSON}"

      - name: Fail unless every required job succeeded
        # `skipped` counts as a failure: no required job is conditional, so a
        # skip means something upstream went wrong.
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A required job failed, was cancelled or was skipped"
          exit 1
