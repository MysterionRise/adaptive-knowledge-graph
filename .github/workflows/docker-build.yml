name: Docker Build

# Advisory: builds the CPU API image and the frontend image when something they
# depend on changes.
# The paths filter means this check does not run on every PR, so it must not
# become a required status check while the filter is in place.
on:
  pull_request:
    branches: [main]
    # Everything the CPU image COPYs (see infra/docker/api.cpu.Dockerfile), plus the
    # build inputs themselves. The image does not copy data/.
    # Frontend image COPYs frontend/ (see infra/docker/frontend.Dockerfile).
    paths:
      - "infra/docker/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "README.md"
      - "backend/**"
      - "config/**"
      - "scripts/**"
      - "frontend/**"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

# One group per PR (superseded runs are cancelled); a manual dispatch gets its
# own group so it is never dropped while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-api-cpu:
    name: Build API image (CPU, advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build infra/docker/api.cpu.Dockerfile (no push)
        run: docker build --file infra/docker/api.cpu.Dockerfile --tag adaptive-kg-api:ci .

      - name: Show image size
        run: docker image ls adaptive-kg-api:ci

      - name: Check that the image reports the package version
        # The Dockerfile registers the project after copying it; app_version reads this
        run: |
          expected=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')
          actual=$(docker run --rm adaptive-kg-api:ci python -c 'from importlib.metadata import version; print(version("adaptive-knowledge-graph"))')
          echo "image reports ${actual}; pyproject.toml says ${expected}"
          [ "${actual}" = "${expected}" ]

  build-frontend:
    name: Build frontend image (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build infra/docker/frontend.Dockerfile (no push)
        run: docker build --file infra/docker/frontend.Dockerfile --tag adaptive-kg-frontend:ci .

      - name: Show image size
        run: docker image ls adaptive-kg-frontend:ci
