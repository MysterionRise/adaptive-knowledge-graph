version: 2

# Version updates are grouped per ecosystem: one weekly PR with all minor and patch
# bumps. Major updates still arrive as individual PRs, and security updates are never
# grouped. Dependabot's `reviewers` key is retired; use a CODEOWNERS file for review requests.
updates:
  # Python (Poetry: pyproject.toml + poetry.lock)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      python-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Deliberate upgrades tracked in issues; keep them out of the weekly group.
      - dependency-name: "torch" # 2.11+ switches the Linux wheels to CUDA 13 (#79)
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "neo4j-graphrag" # 1.22 needs the neo4j 6 driver
        update-types: ["version-update:semver-minor"]

  # Frontend (Next.js, npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Deliberate upgrades tracked in issues; keep them out of the weekly PRs.
      - dependency-name: "tailwindcss" # 4.x needs a CSS migration with screenshot baselines (#164, #143)
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node" # stays on the Node 24 line in .node-version (#144)
        update-types: ["version-update:semver-major"]
      # typescript-eslint (via eslint-config-next) supports TypeScript < 6.1 and refuses to
      # run on TS 7 (#176); upgrade together once it supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react 7.37 (via eslint-config-next) calls context.getFilename(), which
      # eslint 10 removed, so lint crashes (#190); upgrade together once it supports eslint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # API images (infra/docker/*.Dockerfile)
  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Local stack images (infra/compose/compose.yaml)
  - package-ecosystem: "docker-compose"
    directory: "/infra/compose"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      compose-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions (workflows and composite actions)
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
